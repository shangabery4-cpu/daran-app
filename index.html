<!doctype html>
<html lang="ckb-IQ" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>دارەجات — کوردیی سۆرانی</title>
<link rel="icon" href="./icon-192.png"/>
<style>
html,body{margin:0;min-height:100%;font-family:Tahoma,'Segoe UI',Arial,sans-serif;background:#f4f7f5;color:#15362e}main{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px}.mark{font-size:48px}.spinner{margin:16px auto;width:32px;height:32px;border:4px solid #d4e8dd;border-top-color:#087f68;border-radius:50%;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}small{display:block;color:#64756f;margin-top:9px}button{display:none;border:0;border-radius:8px;background:#087f68;color:white;padding:10px 18px;margin:16px auto;cursor:pointer}
</style>
</head>
<body><main><div class="mark">🏫</div><h2>دارەجات — کوردیی سۆرانی</h2><div class="spinner" id="spin"></div><p id="msg">بەرنامەکە دادەکرێت…</p><small>ئەم وەشانە بۆ تاقیکردنەوەی ناوخۆییە.</small><button id="retry" onclick="location.reload()">دووبارە هەوڵ بدەرەوە</button></main>
<script>
(async function(){
  const total=25;
  const urls=Array.from({length:total},(_,i)=>'./parts/part-'+String(i).padStart(3,'0')+'.txt');
  try{
    const data=await Promise.all(urls.map(async u=>{
      const r=await fetch(u,{cache:'no-cache'});
      if(!r.ok)throw new Error('Failed to load '+u+' ('+r.status+')');
      return r.text();
    }));
    const html=data.join('');
    if(!html.startsWith('<!DOCTYPE html>') || !html.trimEnd().endsWith('</html>') || !html.includes('dg-sorani-local-account-portal')) throw new Error('Invalid package');
    document.open(); document.write(html); document.close();
  }catch(e){
    document.getElementById('spin').style.display='none';
    document.getElementById('msg').textContent='بەرنامەکە بە تەواوی بار نەبوو. پەیوەندیی ئینتەرنێت بپشکنە.';
    document.getElementById('retry').style.display='block';
    console.error(e);
  }
})();
</script></body></html>
