name: Firestore Rules Emulator

on:
  push:
    branches: [main]
    paths:
      - 'online/firestore.rules'
      - 'tests/firestore.rules.test.mjs'
      - 'firebase.json'
      - 'package.json'
      - '.github/workflows/firestore-rules.yml'
  pull_request:
    paths:
      - 'online/firestore.rules'
      - 'tests/firestore.rules.test.mjs'
      - 'firebase.json'
      - 'package.json'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run Firestore Security Rules tests in demo project
        run: npm run test:rules
